name: Windows MSVC CI

on:
  workflow_dispatch:
# push:
#   branches: [ "master", "devel" ]
# pull_request:
#   branches: [ "master", "devel" ]

env:
  BUILD_TYPE: RelWithDebInfo
  INSTALL_LOCATION: ${{github.workspace}}/SonivoxEAS
  DRUMSTICK: DrumstickV2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: '🟦', arch: "win64", os: "windows-latest", triplet: "x64-windows" }
          - { icon: '🟩', arch: "arm64", os: "windows-11-arm", triplet: "arm64-windows" }
    runs-on: ${{ matrix.os }}
    name: 🚧${{ matrix.icon }} msvc ${{ matrix.arch }}

    steps:
    - uses: actions/checkout@v6

    - name: '${{ matrix.icon }} Download Drumstick'
      uses: dawidd6/action-download-artifact@v11
      with:
        name: ${{env.DRUMSTICK}}-${{matrix.arch}}
        github_token: ${{secrets.GH_PAT}}
        repo: pedrolcl/drumstick
        allow_forks: false
        workflow: cmake-win.yml
        branch: devel

    - name: '${{ matrix.icon }} Extract Drumstick'
      run: tar xvf ${{env.DRUMSTICK}}.tar

    - name: '${{ matrix.icon }} Build vcpkg'
      uses: johnwason/vcpkg-action@v7
      id: vcpkg
      with:
        pkgs: zlib sonivox qtbase qtmultimedia qttools qttranslations
        triplet: ${{ matrix.triplet }}
        token: ${{ github.token }}

    - name: '${{ matrix.icon }} Install NSIS'
      uses: repolevedavaj/install-nsis@v1.1.0
      with:
        nsis-version: '3.11'

    - name: '${{ matrix.icon }} Setup MSVC'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: '${{ matrix.icon }} Configure CMake'
      id: configuration
      run: >
        cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}
        -G Ninja -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DCMAKE_PREFIX_PATH=${{github.workspace}}/${{env.DRUMSTICK}};${{github.workspace}}/vcpkg/installed/${{matrix.triplet}}
        -DCMAKE_INSTALL_PREFIX=${{env.INSTALL_LOCATION}}
        -DCPACK_SYSTEM_NAME=${{matrix.arch}}
        -DDEPENDENCY_DIRS=${{github.workspace}}/vcpkg/installed/${{matrix.triplet}}/bin;${{github.workspace}}/${{env.DRUMSTICK}}/lib
        -DINSTALL_DEPENDENCIES=ON

    - name: '${{ matrix.icon }} Build'
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: '${{ matrix.icon }} Package'
      run: cmake --build ${{github.workspace}}/build --target package

    - name: '${{ matrix.icon }} Install'
      run: cmake --install ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: '${{ matrix.icon }} Upload Artifacts'
      uses: actions/upload-artifact@v6
      with:
        name: SonivoxEAS-msvc-${{matrix.arch}}
        path: ${{env.INSTALL_LOCATION}}
        retention-days: 90
        overwrite: true

    - name: '${{ matrix.icon }} Upload Installer'
      uses: actions/upload-artifact@v6
      with:
        name: SonivoxEAS-msvc-installer-${{matrix.arch}}
        path: ${{github.workspace}}/build/sonivoxeas-${{steps.configuration.outputs.config_version}}-${{matrix.arch}}.exe
        retention-days: 90
        overwrite: true
